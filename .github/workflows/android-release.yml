name: Android Release

# 推送以 v 开头的 tag（如 v1.0.0）时触发：
# 构建 Release APK 并发布到 GitHub Release。
#
# 可选：在仓库 Settings → Secrets and variables → Actions 配置正式签名，
#   ANDROID_KEYSTORE_BASE64     keystore 文件的 base64（本地: base64 -w0 app.keystore）
#   ANDROID_KEYSTORE_PASSWORD   keystore 密码（storepass）
#   ANDROID_KEYSTORE_ALIAS      key 别名
#   ANDROID_KEY_PASSWORD        key 密码（keypass，PKCS12 下与 storepass 相同）
#
# 未配置 secrets 时使用仓库内的固定 keystore：.github/keystore/slowenglishfm.keystore
#   alias / storepass / keypass 均为 slowenglishfm
# 它保证每次构建签名一致，新版本可直接覆盖安装旧版本。
# 注意：该文件随仓库公开，等于公开私钥 —— 仅适用于内部/自用分发，
# 任何人拿到它都能签出同包名同签名的 APK；对外正式发布请改用上面的 secrets 方案。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # 创建 Release / 上传产物需要

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --source https://api.nuget.org/v3/index.json

      # 准备签名 keystore：优先用仓库 secrets 的正式签名；没有则用仓库内的固定 keystore。
      # 两者都保证「跨版本签名一致」，因此新版本可以直接覆盖安装。
      # 输出写到 GITHUB_OUTPUT，后续步骤通过 steps.keystore.outputs.* 使用。
      - name: Prepare signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "::notice::使用仓库 secrets 提供的正式签名"
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "store=$RUNNER_TEMP/release.keystore"   >> "$GITHUB_OUTPUT"
            echo "alias=$KEY_ALIAS"                       >> "$GITHUB_OUTPUT"
            echo "storepass=$KEYSTORE_PASSWORD"           >> "$GITHUB_OUTPUT"
            echo "keypass=$KEY_PASSWORD"                  >> "$GITHUB_OUTPUT"
          else
            echo "::notice::未配置 secrets，使用仓库内固定 keystore .github/keystore/slowenglishfm.keystore 签名"
            KS="$GITHUB_WORKSPACE/.github/keystore/slowenglishfm.keystore"
            if [ ! -f "$KS" ]; then
              echo "::error::找不到 $KS —— 固定签名文件缺失，拒绝用临时密钥签名（会导致无法覆盖升级）"
              exit 1
            fi
            # PKCS12 keystore 的 keypass 会被忽略，统一传 storepass 即可。
            echo "store=$KS"                >> "$GITHUB_OUTPUT"
            echo "alias=slowenglishfm"      >> "$GITHUB_OUTPUT"
            echo "storepass=slowenglishfm"  >> "$GITHUB_OUTPUT"
            echo "keypass=slowenglishfm"    >> "$GITHUB_OUTPUT"
          fi

      # 构建 Release APK。版本号取自 tag（去掉前缀 v），构建序号取 GITHUB_RUN_NUMBER。
      # 密码等通过 env 注入再展开到命令行，避免直接写进 yaml；GitHub 会自动遮蔽与 secrets 相同的值。
      - name: Build Release APK
        env:
          KS_PATH: ${{ steps.keystore.outputs.store }}
          KS_ALIAS: ${{ steps.keystore.outputs.alias }}
          KS_STOREPASS: ${{ steps.keystore.outputs.storepass }}
          KS_KEYPASS: ${{ steps.keystore.outputs.keypass }}
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          echo "::notice::构建 Slow English FM ${VERSION} (build ${GITHUB_RUN_NUMBER})"

          dotnet build SlowEnglishFmApp/SlowEnglishFmApp.csproj \
            -f net10.0-android -c Release \
            -p:AndroidPackageFormat=apk \
            -p:ApplicationDisplayVersion="$VERSION" \
            -p:ApplicationVersion="$GITHUB_RUN_NUMBER" \
            -p:AndroidKeyStore=True \
            -p:AndroidSigningKeyStore="$KS_PATH" \
            -p:AndroidSigningKeyAlias="$KS_ALIAS" \
            -p:AndroidSigningStorePass="$KS_STOREPASS" \
            -p:AndroidSigningKeyPass="$KS_KEYPASS"

          # 产物：SlowEnglishFmApp/bin/Release/net10.0-android/*-Signed.apk
          mkdir -p artifacts
          APK="$(find SlowEnglishFmApp/bin/Release/net10.0-android -maxdepth 2 -name '*-Signed.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::未找到 *-Signed.apk 产物"
            exit 1
          fi
          echo "APK = $APK"
          cp "$APK" "artifacts/SlowEnglishFmApp-${VERSION}-android.apk"
          ls -lh artifacts/

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Slow English FM ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*.apk
